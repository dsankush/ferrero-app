<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="goldSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF3A7"/>
      <stop offset="25%" stop-color="#FFE066"/>
      <stop offset="60%" stop-color="#D4A574"/>
      <stop offset="85%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#5B3A06"/>
    </radialGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A2511"/>
      <stop offset="50%" stop-color="#2D1306"/>
      <stop offset="100%" stop-color="#140702"/>
    </linearGradient>
    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFE899"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D4A574" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Dark Rounded Square -->
  <rect width="512" height="512" rx="112" fill="#140B07"/>
  
  <!-- Outer Gold Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldSphere)" stroke-width="12" stroke-opacity="0.8"/>

  <!-- Chocolate Wrapper Pleated Cup -->
  <path d="M 128 350 Q 256 460 384 350 L 416 410 Q 256 490 96 410 Z" fill="url(#cupGrad)" stroke="#D4A574" stroke-width="4"/>
  
  <!-- Main Golden Rocher Sphere -->
  <circle cx="256" cy="235" r="160" fill="url(#goldSphere)" filter="url(#glow)"/>

  <!-- Texture / Dimples on Rocher Foil -->
  <circle cx="180" cy="160" r="14" fill="#FFF3A7" opacity="0.6"/>
  <circle cx="320" cy="170" r="18" fill="#FFF3A7" opacity="0.4"/>
  <circle cx="140" cy="240" r="16" fill="#996515" opacity="0.5"/>
  <circle cx="360" cy="250" r="15" fill="#996515" opacity="0.5"/>
  <circle cx="220" cy="115" r="12" fill="#FFFFFF" opacity="0.7"/>

  <!-- Brown Oval Sticker Label -->
  <ellipse cx="256" cy="235" rx="100" ry="70" fill="#2E1408" stroke="url(#goldSphere)" stroke-width="6"/>

  <!-- FR / Ferrero Text Monogram -->
  <text x="256" y="245" font-family="'Plus Jakarta Sans', 'Playfair Display', Georgia, serif" font-weight="900" font-size="64" fill="url(#textGold)" text-anchor="middle" letter-spacing="2">FERRERO</text>
  <text x="256" y="275" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#D4A574" text-anchor="middle" letter-spacing="6">ROCHER</text>

  <!-- Sparkle Stars -->
  <path d="M 370 120 L 375 135 L 390 140 L 375 145 L 370 160 L 365 145 L 350 140 L 365 135 Z" fill="#FFFFFF"/>
  <path d="M 130 310 L 133 320 L 143 323 L 133 326 L 130 336 L 127 326 L 117 323 L 127 320 Z" fill="#FFF3A7"/>
</svg>